# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Repair fallback patch matcher
        run: python scripts/fix_model_fallback_patch_harness.py
      - name: Apply model fallback resilience patch
        run: python scripts/apply_model_fallback_resilience.py
      - name: Install project and QA tools
        run: python -m pip install -e '.[dev]' ruff pyright
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff critical checks
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q
      - name: Pyright
        run: pyright src
      - name: Commit verified fallback implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add resilient same-provider model fallback"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
