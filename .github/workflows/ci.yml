# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and QA tools
        run: python -m pip install -e '.[dev]' ruff pyright
      - name: Apply focused PR #10 implementation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        run: python scripts/apply_pr10.py
      - name: Fix explicit bare-provider routing
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
        run: python scripts/fix_pr10_explicit.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff critical checks
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q
      - name: Pyright
        run: pyright src
      - name: Commit verified PR #10 implementation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 10 && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f scripts/apply_pr10.py scripts/fix_pr10_explicit.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat(router): add tiered provider backoff'
          git push origin HEAD:fix-provider-blocking
