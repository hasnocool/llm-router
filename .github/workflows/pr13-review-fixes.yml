name: PR13 review fixes

on:
  push:
    branches:
      - agent/model-fallback-resilience

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/model-fallback-resilience
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: python scripts/apply_pr13_review_fixes.py
      - name: Install project and QA tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio ruff pyright
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff critical checks
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q
      - name: Pyright
        run: pyright src
      - name: Commit verified fixes
        run: |
          rm scripts/apply_pr13_review_fixes.py
          rm .github/workflows/pr13-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llm_router/zero_cost_router.py tests/test_model_fallback_resilience.py scripts/apply_pr13_review_fixes.py .github/workflows/pr13-review-fixes.yml
          git commit -m "fix: address model fallback review findings"
          git push origin HEAD:agent/model-fallback-resilience
