# .github/workflows/repair-pr9.yml
name: Repair PR 9

on:
  push:
    branches:
      - fix-metrics-seeding

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix-metrics-seeding
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and QA tools
        run: python -m pip install -e '.[dev]' ruff pyright

      - name: Apply merge-gate repairs
        run: python scripts/repair_pr9.py

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff critical checks
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Tests
        run: pytest -q

      - name: Pyright
        run: pyright src

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-pr9.yml scripts/repair_pr9.py
          git add -A
          git commit -m 'fix: resolve PR review and CI blockers'
          git push origin HEAD:fix-metrics-seeding
