name: Dashboard live-update patch

on:
  push:
    branches: [agent/dashboard-live-updates]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-live-updates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply dashboard live-update patch
        run: python scripts/apply_dashboard_live_updates.py
      - name: Install project and QA tools
        run: python -m pip install -e '.[dev]' ruff pyright
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff critical checks
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q
      - name: Pyright
        run: pyright src
      - name: Commit verified dashboard live updates
        run: |
          rm scripts/apply_dashboard_live_updates.py .github/workflows/dashboard-live-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make dashboard update live"
          git push origin HEAD:agent/dashboard-live-updates
