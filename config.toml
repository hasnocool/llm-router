# llm-router configuration

# Global routing strategy:
#   "zero-cost"  -> rank renewable free routes using the packaged provider matrix,
#                   then fail over on quota/rate-limit/provider exhaustion.
#   "cloud-first" -> preserve the original cloud-first fallback behavior.
#   "local-first" -> prefer the local llama.cpp provider before cloud routes.
strategy = "zero-cost"

# Providers eligible for automatic/fallback routing and the /v1/models list.
# Under strategy="zero-cost", "auto" picks the best-ranked healthy provider and
# fails over through the rest. Explicit "provider:model" requests always work.
[routing]
providers = ["groq", "huggingface", "google_ai", "cerebras", "nvidia", "openrouter", "local"]

# Seconds to wait before treating a non-streaming call as failed (per provider).
timeout_seconds = 60.0

[providers.huggingface]
name = "HuggingFace Serverless Inference"
base_url = "https://router.huggingface.co/v1"
default_model = "Qwen/Qwen3-8B"
api_key_env = "HF_TOKEN"
timeout_seconds = 120.0
stream_timeout_seconds = 240.0

[providers.local]
name = "Local llama-server"
base_url = "http://127.0.0.1:8081"
default_model = "granite-3.3-2b-instruct"

[providers.cerebras]
name = "Cerebras Inference"
base_url = "https://api.cerebras.ai/v1"
default_model = "gpt-oss-120b"
api_key_env = "CEREBRAS_API_KEY"
timeout_seconds = 120.0
stream_timeout_seconds = 240.0

[providers.groq]
name = "Groq"
base_url = "https://api.groq.com/openai/v1"
default_model = "llama-3.3-70b-versatile"
api_key_env = "GROQ_API_KEY"
timeout_seconds = 120.0
stream_timeout_seconds = 240.0

[providers.nvidia]
name = "NVIDIA NIM"
base_url = "https://integrate.api.nvidia.com/v1"
default_model = "meta/llama-3.3-70b-instruct"
api_key_env = "NVIDIA_API_KEY"
timeout_seconds = 120.0
stream_timeout_seconds = 240.0

[providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
default_model = "openrouter/free"
api_key_env = "OPENROUTER_API_KEY"
timeout_seconds = 120.0
stream_timeout_seconds = 240.0

[providers.google_ai]
name = "Google AI (Gemini)"
base_url = "https://generativelanguage.googleapis.com/v1beta"
default_model = "gemini-3.5-flash"
api_key_env = "GOOGLE_AI_API_KEY"
timeout_seconds = 120.0
stream_timeout_seconds = 240.0

# Model aliases clients can use. A "provider:" prefix forces explicit routing.
# Under strategy="zero-cost", an unforced request can use another configured
# provider's default model when that route has a better renewable-free score.
[models]
"qwen3-8b" = { provider = "huggingface", model = "Qwen/Qwen3-8B" }
"qwen3-14b" = { provider = "huggingface", model = "Qwen/Qwen3-14B" }
"qwen2.5-7b" = { provider = "huggingface", model = "Qwen/Qwen2.5-7B-Instruct" }
"llama-3.1-8b" = { provider = "huggingface", model = "meta-llama/Llama-3.1-8B-Instruct" }
"deepseek-r1-7b" = { provider = "huggingface", model = "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B" }
# Local aliases removed: routing is HuggingFace-only (see [routing]).

# Special value: "auto" (or empty model string) routes to the best-ranked
# available provider using its default model, with failover through the rest.

# Zero-cost policy is controlled with environment variables so deployments can
# change policy without editing this file. See .env.example and docs/ROUTING_SCORE.md.

[metrics]
# SQLite database path (relative to config.toml or absolute)
# db_path = "metrics.db"
flush_interval_seconds = 30
retention_days = 30
report_interval_seconds = 300
model_cache_ttl_seconds = 21600
model_failure_backoff_seconds = 300
model_failure_backoff_max_seconds = 3600
# /models is never used as a background heartbeat. Explicit discovery is cached.

[logs]
# Root logger level: DEBUG, INFO, WARNING, ERROR
level = "INFO"
# Optional rotating file log (relative to config.toml or absolute).
# Omit or set to "" to disable file logging (console + dashboard event log remain).
file_path = "logs/router.log"
max_bytes = 10485760
backup_count = 5
# Persist full request/response bodies only when explicitly enabled for local debugging.
# Bodies may contain private or personal data.
log_message_bodies = false
max_body_chars = 120000

[analytics]
# Estimated USD per 1M tokens. Tune these to your actual provider plans.
currency = "USD"
default_input_cost_per_1m_tokens = 0.25
default_output_cost_per_1m_tokens = 0.25
error_rate_warning_threshold = 0.05
error_rate_critical_threshold = 0.10
failover_rate_warning_threshold = 0.15

[analytics.pricing.groq]
input_cost_per_1m_tokens = 0.59
output_cost_per_1m_tokens = 0.79

[analytics.pricing.huggingface]
input_cost_per_1m_tokens = 0.25
output_cost_per_1m_tokens = 0.25

[analytics.pricing.google_ai]
input_cost_per_1m_tokens = 0.35
output_cost_per_1m_tokens = 1.05

[analytics.pricing.cerebras]
input_cost_per_1m_tokens = 0.25
output_cost_per_1m_tokens = 0.75

[analytics.pricing.nvidia]
input_cost_per_1m_tokens = 0.10
output_cost_per_1m_tokens = 0.10

[analytics.pricing.openrouter]
# OpenRouter is configured for a free model right now.
input_cost_per_1m_tokens = 0.0
output_cost_per_1m_tokens = 0.0

[analytics.pricing.local]
input_cost_per_1m_tokens = 0.0
output_cost_per_1m_tokens = 0.0

# Provider quotas are frequently model/tier/account-specific and change over time.
# The router learns provider-side request/token windows from response headers.
# Configure an optional local safety guard only when you know the exact limit:
#
# [quotas.groq]
# daily_requests = 1000
# daily_tokens = 100000
# reset_hour = 0  # UTC
